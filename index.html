<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      Johya Fashions | Family Clothing Store in Mallampet, Hyderabad
    </title>

    <meta
      name="description"
      content="Johya Fashions is a family clothing store in Mallampet, Hyderabad, offering stylish collections for women, men and kids, including ethnic, festive, casual and formal wear."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Johya Fashions | Family Clothing Store in Mallampet"
    />

    <meta
      property="og:description"
      content="Shop stylish fashion for women, men and kids at Johya Fashions, a family clothing store in Mallampet, Hyderabad."

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Johya Fashions"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Johya Fashions | Family Clothing Store in Mallampet"
    />

    <meta
      name="twitter:description"
      content="Family fashion and clothing store in Mallampet, Hyderabad for women, men and kids."
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://www.johyafashions.in/"
    />

    <script type="application/ld+json">

      "@context": "https://schema.org",

      "url": "https://www.johyafashions.in/",
      "telephone": "+916301071131",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Mallampet",
        "addressLocality": "Hyderabad",
        "addressRegion": "Telangana",
        "addressCountry": "IN"
      },
      "priceRange": "$$"
    }
    </script>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
